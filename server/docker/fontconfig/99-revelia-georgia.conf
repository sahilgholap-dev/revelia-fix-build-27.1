<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  R9 §14 step 6b — Georgia substitution for the report renderer.

  Georgia is a proprietary Microsoft core font: it is NOT in any standard Linux
  font package and is NOT freely redistributable (ttf-mscorefonts-installer
  carries a click-through EULA), so it cannot be baked into this image.

  The report docx (report-render.service.ts) sets font "Georgia" on every run.
  This maps "Georgia" -> "DejaVu Serif" so LibreOffice substitutes it
  DETERMINISTICALLY at docx->PDF time, instead of falling back to whatever
  fontconfig's default serif happens to be.

  Why DejaVu Serif specifically:
    - It is the SAME next-choice fallback report-charts.py already declares
      (["Georgia","DejaVu Serif","Times New Roman"]) -> body text and chart text
      resolve to the same face, so the page reads as one document.
    - It is a generous-width, large-x-height serif close to Georgia's metrics —
      closer than the Times-metric Liberation Serif — so it PRESERVES the ~18pp
      layout 6a produced with real Georgia (a narrower substitute risks dropping
      the report under the 18pp gate floor).
    - The fidelity baseline is the SHIPPED SAMPLE, which itself embeds only
      base-14 (Helvetica/Times-Roman) — it is NOT true Georgia — so a
      metric-compatible serif legitimately matches the reference artifact.

  If the owner later supplies a licensed Georgia .ttf, drop it into the image and
  remove this alias for exact typographic fidelity.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
</fontconfig>
